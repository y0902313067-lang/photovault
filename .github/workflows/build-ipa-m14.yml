name: build-ipa-m14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen 2.38（兼容 Xcode 15）
        run: |
          curl -sL -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip
          unzip -q /tmp/xg.zip -d /tmp
          ls /tmp/xcodegen
          echo "/tmp/xcodegen/bin" >> $GITHUB_PATH

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          grep -m1 objectVersion PhotoVault.xcodeproj/project.pbxproj

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoVault.xcodeproj \
            -scheme PhotoVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhotoVault.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 打成未签名 ipa
        run: |
          mkdir -p build/Payload
          cp -R build/PhotoVault.xcarchive/Products/Applications/PhotoVault.app build/Payload/
          cd build
          zip -qr PhotoVault-unsigned.ipa Payload
          ls -lh PhotoVault-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-unsigned-ipa-m14
          path: build/PhotoVault-unsigned.ipa
          retention-days: 30
